name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Upload assets
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Rust binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rjq
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: upload-assets
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/generate-homebrew-formula.sh "${{ github.ref_name }}" > rjq.rb

      - name: Create tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: donkomura
          repositories: homebrew-tap
          permission-contents: write

      - name: Update formula
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          FORMULA_PATH: repos/donkomura/homebrew-tap/contents/Formula/rjq.rb
        run: |
          current=$(gh api "$FORMULA_PATH")
          if jq -r .content <<< "$current" | base64 -d | cmp -s - rjq.rb; then
            exit 0
          fi
          gh api --method PUT "$FORMULA_PATH" \
            -f message="feat: rjq を ${{ github.ref_name }} に更新する" \
            -f content="$(base64 -w0 rjq.rb)" \
            -f sha="$(jq -r .sha <<< "$current")"
