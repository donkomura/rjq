[package]
name = "rjq"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.0", features = ["derive", "env"] }
# use-dev-tty makes crossterm poll /dev/tty with poll(2) instead of mio. macOS kqueue
# cannot register /dev/tty, which crossterm opens whenever stdin is a pipe.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
ratatui = "0.29.0"
serde = "1"
serde_json = "1.0.142"
syntect = { version = "5.3.0", default-features = false, features = ["plist-load", "default-themes"] }
thiserror = "1.0"
